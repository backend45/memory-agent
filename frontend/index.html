<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Agent</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>Memory Agent</h1>
            <p>Upload your documents. Ask your memory anything.</p>
        </header>


        <!-- UPLOAD -->
        <section class="card">

            <h2>Upload a document</h2>

            <p class="description">
                Upload a PDF and let AI remember it.
            </p>

            <div class="upload-area">

                <input
                    type="file"
                    id="fileInput"
                    accept=".pdf"
                >

                <button id="uploadButton">
                    Upload PDF
                </button>

            </div>

            <div id="uploadStatus"></div>

        </section>


        <!-- ASK -->
        <section class="card">

            <h2>Ask your memory</h2>

            <p class="description">
                Ask a question about your uploaded documents.
            </p>

            <textarea
                id="question"
                placeholder="e.g. When is my mathematics assignment due?"
            ></textarea>

            <button id="askButton">
                Ask AI
            </button>

            <div id="answer"></div>

        </section>

    </main>


    <script src="./script.js"></script>

</body>
</html>
